<!DOCTYPE html>
<html lang="ko" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Embedding Test</title>
    <style>
      body {background-color: powderblue;}
      h1   {color: blue; text-align:center;}
      h2   {text-align:center;}
      p    {text-align:center; font-size:100%;}
    </style>
  </head>

<body>
<h1>Youtube Embedding Test</h1>

<h3>한국사 강의</h3>
<iframe 
title="이덕일한국사"        
width="560" height="315" 
src="https://www.youtube.com/embed/bSqrxj2w6Yg" 
allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" 
allowfullscreen>
</iframe>

<h3>아이유 노래, 개인정보 보호 모드</h3>
<iframe title="아이유" width="560" height="315" src="https://www.youtube-nocookie.com/embed/DmphyYj4irw"  allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
<span><a href="undefined" target="_blank">아이유</a> by nash</span>

<h3>유투브 개발자</h3>
<iframe id="ytplayer" type="text/html" width="640" height="360"
  src="https://www.youtube.com/embed/M7lc1UVf-VE?autoplay=1&origin=http://example.com" 
  title="유튜브개발자"        
  >
</iframe>

  
  <iframe width="560" height="315" src="https://www.youtube.com/embed/videoseries?si=OQhEm2I8vDmEMeQA&amp;list=PLnsvxagVw5Mf_o0-wy5Lshtuy3yiacCNA" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  
</body>
</html>
